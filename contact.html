<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web - Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-contact bg-contact">
    
    <nav class="navbar">
        <a href="index.html" class="logo">BRAND.</a>
        <ul class="nav-links">
            <li><a href="index.html" id="home-link">Home</a></li>
            <li><a href="about.html" id="about-link">About</a></li>
            <li><a href="services.html" id="services-link">Services</a></li>
            <li><a href="portfolio.html" id="portfolio-link">Portfolio</a></li>
            <li><a href="contact.html" id="contact-link">Contact</a></li>
        </ul>
        <div class="hamburger">
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <section class="hero reveal" style="min-height: 40vh; margin-top: 5rem;">
        <h1>Get in Touch</h1>
        <p>Let's discuss how we can work together.</p>
    </section>

    <div class="contact-container reveal">
        <div class="contact-info card">
            <h2>Contact Information</h2>
            <p style="margin: 1rem 0;"><i class="fas fa-map-marker-alt" style="color: var(--primary-color);"></i> 123 Tech Avenue, NY 10001</p>
            <p style="margin: 1rem 0;"><i class="fas fa-envelope" style="color: var(--primary-color);"></i> hello@brand.com</p>
            <p style="margin: 1rem 0;"><i class="fas fa-phone" style="color: var(--primary-color);"></i> +1 (555) 123-4567</p>
            
            <div style="margin-top: 2rem; width: 100%; height: 250px; background: #e2e8f0; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #64748b;">
                <i class="fas fa-map" style="font-size: 2rem; margin-right: 10px;"></i> Map Placeholder
            </div>
        </div>
        
        <form class="contact-form">
            <h2>Send us a Message</h2>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <input type="text" placeholder="Subject" required>
            <textarea rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <footer>
        <div class="social-icons">
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-linkedin"></i></a>
        </div>
        <p>&copy; 2026 Brand Inc. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
